name: Import Jobs

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - does not call endpoints, just prints URLs'
        required: false
        default: 'false'
        type: boolean

jobs:
  import:
    name: Import Arbeitnow + Remotive + Adzuna
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ secrets.APP_URL }}

    steps:
      - name: Check secrets
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — would call:"
            echo "  ${APP_URL}/api/cron/import-arbeitnow"
            echo "  ${APP_URL}/api/cron/import-remotive"
            for country in gb fr de ca au nl; do
              echo "  ${APP_URL}/api/cron/import-adzuna?country=${country}"
            done
            exit 0
          fi
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::error::CRON_SECRET and APP_URL secrets must be set"
            exit 1
          fi

      - name: Import Arbeitnow
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-arbeitnow")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Arbeitnow failed (${HTTP_CODE}) — continuing"

      - name: Import Remotive
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-remotive")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Remotive failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna GB
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=gb")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna GB failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna FR
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=fr")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna FR failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna DE
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=de")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna DE failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna CA
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=ca")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna CA failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna AU
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=au")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna AU failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna NL
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=nl")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna NL failed (${HTTP_CODE}) — continuing"
      - name: Enrich Jobs (geo-analysis)
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/enrich.json -w "%{http_code}" --max-time 55 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/admin/enrich-jobs")
            cat /tmp/enrich.json
            REMAINING=$(cat /tmp/enrich.json | grep -o '"remaining":[0-9]*' | grep -o '[0-9]*')
            echo "Remaining: ${REMAINING}"
            [ "${REMAINING}" = "0" ] && break
            sleep 10
          done
      - name: Import WWR
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-wwr")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::WWR failed (${HTTP_CODE}) — continuing"

      - name: Import Himalayas, Jobicy, Greenhouse
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |-
          node -e '
          const https = require("https");
          const { createClient } = require("@supabase/supabase-js");
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
          function fetchText(url) { return new Promise((resolve, reject) => { https.get(url, { timeout: 10000 }, (res) => { let data = ""; res.on("data", chunk => data += chunk); res.on("end", () => resolve(data)); }).on("error", reject); }); }
          function extractTag(xml, tag) { const regex = new RegExp("<" + tag + "[^>]*>([\\s\\S]*?)</" + tag + ">"); return xml.match(regex)?.[1] || ""; }
          function cleanHTML(text) { return text.replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, "\"").replace(/&#39;/g, "\"'\"").trim(); }
          (async () => {
            try {
              console.log("[Himalayas] Starting...");
              const data = await fetchText("https://himalayas.app/jobs/api").then(JSON.parse);
              const jobs = data.jobs || [];
              let imported = 0, deduplicated = 0;
              for (const j of jobs) {
                if (!j.title || !j.companyName) continue;
                const applyUrl = "https://himalayas.app/jobs/" + j.companySlug + "-" + j.title.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
                const { data: byUrl } = await supabase.from("jobs").select("id").eq("apply_url", applyUrl).limit(1);
                if (byUrl?.[0]) { deduplicated++; continue; }
                const { data: byTitle } = await supabase.from("jobs").select("id").ilike("title", j.title.trim()).ilike("company_name", j.companyName.trim()).limit(1);
                if (byTitle?.[0]) { deduplicated++; continue; }
                const location = j.locationRestrictions?.[0] || "Remote";
                const { error } = await supabase.from("jobs").insert({ title: j.title, company_name: j.companyName, description: j.description || "", location, work_type: "remote", job_type: j.employmentType || "Full-time", category: j.parentCategories?.[0] || "Other", tags: j.categories?.slice(0, 5) || [], apply_url: applyUrl, source: "himalayas", salary_min: j.minSalary || null, salary_max: j.maxSalary || null, salary_label: j.salaryPeriod ? j.minSalary + "-" + j.maxSalary + " " + j.currency + "/" + j.salaryPeriod : null, is_active: true, posted_by: null });
                if (error) console.error("[Himalayas] Insert error:", error.message);
                else imported++;
              }
              console.log(JSON.stringify({ source: "himalayas", imported, deduplicated }));
            } catch (err) { console.error("[Himalayas] Error:", err.message); }
            try {
              console.log("[Jobicy] Starting...");
              const xml = await fetchText("https://jobicy.com/?feed=job_feed");
              let imported = 0, deduplicated = 0;
              const itemRegex = /<item>([\s\S]*?)<\/item>/g;
              let match;
              while ((match = itemRegex.exec(xml)) !== null) {
                const item = match[1];
                const title = extractTag(item, "title");
                const link = extractTag(item, "link");
                const description = extractTag(item, "description");
                const company = extractTag(item, "company") || "Unknown";
                if (!title || !link) continue;
                const { data: byUrl } = await supabase.from("jobs").select("id").eq("apply_url", link).limit(1);
                if (byUrl?.[0]) { deduplicated++; continue; }
                const { data: byTitle } = await supabase.from("jobs").select("id").ilike("title", title.trim()).ilike("company_name", company.trim()).limit(1);
                if (byTitle?.[0]) { deduplicated++; continue; }
                const { error } = await supabase.from("jobs").insert({ title: cleanHTML(title), company_name: cleanHTML(company), description: cleanHTML(description), location: "Remote", work_type: "remote", job_type: "Full-time", category: "Other", tags: [], apply_url: link, source: "jobicy", salary_min: null, salary_max: null, salary_label: null, is_active: true, posted_by: null });
                if (error) console.error("[Jobicy] Insert error:", error.message);
                else imported++;
              }
              console.log(JSON.stringify({ source: "jobicy", imported, deduplicated }));
            } catch (err) { console.error("[Jobicy] Error:", err.message); }
            try {
              console.log("[Greenhouse] Starting...");
              const companies = ["gitlab", "automattic", "zapier", "buffer", "doist", "basecamp", "hotjar", "toggl", "remote", "deel"];
              let imported = 0, deduplicated = 0;
              for (const company of companies) {
                try {
                  const data = await fetchText("https://boards-api.greenhouse.io/v1/boards/" + company + "/jobs?content=true").then(JSON.parse);
                  const jobs = data.jobs || [];
                  for (const j of jobs) {
                    if (!j.absolute_url || !j.title) continue;
                    const { data: byUrl } = await supabase.from("jobs").select("id").eq("apply_url", j.absolute_url).limit(1);
                    if (byUrl?.[0]) { deduplicated++; continue; }
                    const { data: byTitle } = await supabase.from("jobs").select("id").ilike("title", j.title.trim()).ilike("company_name", company.trim()).limit(1);
                    if (byTitle?.[0]) { deduplicated++; continue; }
                    const { error } = await supabase.from("jobs").insert({ title: j.title, company_name: company, description: j.content || "", location: j.location?.name || "Remote", work_type: "remote", job_type: "Full-time", category: "Other", tags: [], apply_url: j.absolute_url, source: "greenhouse", salary_min: null, salary_max: null, salary_label: null, is_active: true, posted_by: null });
                    if (error) console.error("[Greenhouse]", company, "insert:", error.message);
                    else imported++;
                  }
                } catch (e) { console.warn("[Greenhouse]", company, "failed:", e.message); }
              }
              console.log(JSON.stringify({ source: "greenhouse", imported, deduplicated }));
            } catch (err) { console.error("[Greenhouse] Error:", err.message); }
          })();
          '
