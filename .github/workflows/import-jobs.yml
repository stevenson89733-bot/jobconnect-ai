name: Import Jobs

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (does not call the endpoints, just prints the URLs)'
        required: false
        default: 'false'
        type: boolean

jobs:
  import:
    name: Import Arbeitnow + Remotive + Adzuna
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ secrets.APP_URL }}

    steps:
      - name: Check secrets
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — would call:"
            echo "  ${APP_URL}/api/cron/import-arbeitnow"
            echo "  ${APP_URL}/api/cron/import-remotive"
            for country in gb fr de ca au nl; do
              echo "  ${APP_URL}/api/cron/import-adzuna?country=${country}"
            done
            exit 0
          fi
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::error::CRON_SECRET and APP_URL secrets must be set"
            exit 1
          fi

      - name: Import Arbeitnow
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-arbeitnow")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Arbeitnow failed (${HTTP_CODE}) — continuing"

      - name: Import Remotive
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-remotive")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Remotive failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna GB
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=gb")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna GB failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna FR
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=fr")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna FR failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna DE
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=de")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna DE failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna CA
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=ca")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna CA failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna AU
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=au")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna AU failed (${HTTP_CODE}) — continuing"

      - name: Import Adzuna NL
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-adzuna?country=nl")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::Adzuna NL failed (${HTTP_CODE}) — continuing"
      - name: Enrich Jobs (geo-analysis)
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/enrich.json -w "%{http_code}" --max-time 55 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/admin/enrich-jobs")
            cat /tmp/enrich.json
            REMAINING=$(cat /tmp/enrich.json | grep -o '"remaining":[0-9]*' | grep -o '[0-9]*')
            echo "Remaining: ${REMAINING}"
            [ "${REMAINING}" = "0" ] && break
            sleep 10
          done
      - name: Import WWR
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/import-wwr")
          cat /tmp/response.json
          echo "HTTP Status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || echo "::warning::WWR failed (${HTTP_CODE}) — continuing"
